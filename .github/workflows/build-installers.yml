name: Build Android APK and Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"
      - "desktop-wrapper/**"
      - ".github/workflows/build-installers.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android wrapper dependencies
        working-directory: android-wrapper
        run: npm install
      - name: Generate Android project and build APK
        working-directory: android-wrapper
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nrk-beauty-hub-android-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop wrapper dependencies
        working-directory: desktop-wrapper
        run: npm install
      - name: Build Windows installer
        working-directory: desktop-wrapper
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: nrk-beauty-hub-windows-installer
          path: desktop-wrapper/dist/*.exe
